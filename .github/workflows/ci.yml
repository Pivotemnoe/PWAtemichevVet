name: TemichevVet PWA CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Python compile and project check
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m compileall -q app scripts
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_project.py

      - name: API regression tests
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/test_api.py

      - name: Frontend syntax checks
        run: |
          node --check web/app.js
          python -m json.tool web/manifest.webmanifest >/dev/null
